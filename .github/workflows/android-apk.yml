name: Build and publish Android APK

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Set Android version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "ANDROID_VERSION_CODE=$((RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.${RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: Frontend/android
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          node -e 'const fs = require("node:fs"); const token = process.env.MAPBOX_ACCESS_TOKEN || ""; if (token && !token.startsWith("pk.")) { console.error("Invalid MAPBOX_ACCESS_TOKEN GitHub Actions secret; expected a Mapbox public token."); process.exit(1); } if (!token) console.warn("MAPBOX_ACCESS_TOKEN is not set; the running map will use OpenStreetMap tiles."); fs.writeFileSync("../src/config/mapbox.ts", `export const MAPBOX_ACCESS_TOKEN = ${JSON.stringify(token)};\n`);'
          ./gradlew --no-daemon -PallowDebugReleaseSigning=true assembleRelease

      - name: Stage APK
        run: |
          mkdir -p release
          cp Frontend/android/app/build/outputs/apk/release/app-release.apk release/WorkOut-App.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "android-${RUN_NUMBER}" release/WorkOut-App.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "WorkOut Android build ${RUN_NUMBER}" \
            --notes "Android APK built from commit ${COMMIT_SHA}, signed with the project's Android debug key. This is a test build and is not suitable for Play Store publishing." \
            --target "${COMMIT_SHA}" \
            --latest
