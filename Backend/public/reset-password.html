<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · WorkOut</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c2522; background: #f4f6f3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #dce3dd; border-radius: 16px; background: white; }
    h1 { margin: 0; font-size: 28px; }
    p { color: #59635d; line-height: 1.5; }
    label { display: block; margin: 22px 0 7px; font-weight: 650; }
    input { width: 100%; padding: 13px; border: 1px solid #c7d0c9; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 8px; color: white; background: #17724d; font: inherit; font-weight: 700; }
    button:disabled { opacity: .55; }
    #message { min-height: 24px; }
    #message.error { color: #b42318; }
    #message.success { color: #17724d; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p>Use at least 6 characters. This reset link can only be used once.</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="6" required>
      <button id="submit" type="submit">Update password</button>
    </form>
    <p id="message" role="status"></p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('form');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');

    if (!token) {
      form.hidden = true;
      message.textContent = 'This reset link is missing its token. Request a new one from the app.';
      message.className = 'error';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirm').value) {
        message.textContent = 'The passwords do not match.';
        message.className = 'error';
        return;
      }

      button.disabled = true;
      try {
        const response = await fetch('/api/app/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to reset password.');
        form.hidden = true;
        message.textContent = 'Password updated. Return to WorkOut and log in with your new password.';
        message.className = 'success';
        history.replaceState(null, '', location.pathname);
      } catch (error) {
        message.textContent = error instanceof Error ? error.message : 'Unable to reset password.';
        message.className = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
