<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Motion Library</title><link rel="stylesheet" href="/css/styles.css"></head><body><script type="module">import {initLayout} from '/js/layout.js';import {get,put} from '/js/api.js';import {changePassword} from '/js/auth.js';import {toast} from '/js/toast.js';if(await initLayout('Settings')){const root=document.getElementById('page-content');root.innerHTML='<div class="form-grid"><form class="panel" id="site"><h2>Site settings</h2><div class="field"><label>Site title</label><input name="siteTitle"></div><div class="field"><label>Logo URL</label><input name="logoUrl" type="url"></div><div class="field"><label>YouTube URL</label><input name="youtube" type="url"></div><div class="field"><label>Instagram URL</label><input name="instagram" type="url"></div><button class="btn">Save settings</button></form><form class="panel" id="password"><h2>Change password</h2><div class="field"><label>Current password</label><input name="currentPassword" type="password" required></div><div class="field"><label>New password</label><input name="newPassword" type="password" minlength="10" required></div><button class="btn">Update password</button></form></div>';const {data}=await get('/settings');site.siteTitle.value=data.siteTitle||'';site.logoUrl.value=data.logoUrl||'';site.youtube.value=data.socialLinks?.youtube||'';site.instagram.value=data.socialLinks?.instagram||'';site.onsubmit=async(e)=>{e.preventDefault();await put('/settings',{siteTitle:site.siteTitle.value,logoUrl:site.logoUrl.value,socialLinks:{youtube:site.youtube.value,instagram:site.instagram.value}});toast('Settings saved')};password.onsubmit=async(e)=>{e.preventDefault();try{await changePassword(password.currentPassword.value,password.newPassword.value);toast('Password changed. Please log in again.');setTimeout(()=>location.href='/login.html',700)}catch(err){toast(err.message,'error')}};}</script></body></html>
