<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Member details · Motion Library</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<script type="module">
import { initLayout } from '/js/layout.js';
import { get } from '/js/api.js';
import { escapeHtml } from '/js/app.js';

if (await initLayout('Member details')) {
  const root = document.getElementById('page-content');
  const id = new URLSearchParams(location.search).get('id');
  root.innerHTML = '<div class="detail-toolbar"><a class="text-link" href="/dashboard.html">← Dashboard</a></div><div id="detail-content"><div class="panel empty">Loading member details…</div></div>';
  try {
    if (!id) throw new Error('A member ID is required to view details.');
    const { data: user } = await get(`/dashboard/users/${encodeURIComponent(id)}`);
    const fullName = escapeHtml(user.name);
    const initials = user.name.split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase();
    const profile = [
      ['Email', user.email],
      ['Phone', user.phone || 'Not provided'],
      ['Gender', user.gender || 'Not set'],
      ['Age', user.age ? `${user.age} years` : 'Not set'],
      ['Height', user.height ? `${user.height} cm` : 'Not set'],
      ['Weight', user.weight ? `${user.weight} kg` : 'Not set'],
      ['Fitness goal', user.goal || 'Not set'],
      ['Email verified', user.emailVerified ? 'Yes' : 'No'],
      ['Phone verified', user.phoneVerified ? 'Yes' : 'No'],
    ];
    document.getElementById('detail-content').innerHTML = `
      <section class="member-hero">
        <div class="member-avatar" aria-hidden="true">${escapeHtml(initials)}</div>
        <div><span class="eyebrow">MEMBER PROFILE</span><h2>${fullName}</h2><p>${escapeHtml(user.email)}</p></div>
        <div class="member-signins"><strong>${Number(user.loginCount) || 0}</strong><span class="eyebrow">TOTAL LOGINS</span></div>
      </section>
      <section class="detail-grid">
        <article class="panel detail-section">
          <span class="eyebrow">ACCOUNT</span><h2>Profile information</h2>
          <dl class="detail-list">${profile.map(([label, value]) => `<div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd></div>`).join('')}</dl>
        </article>
        <article class="panel detail-section">
          <span class="eyebrow">ACTIVITY</span><h2>Account activity</h2>
          <dl class="detail-list">
            <div><dt>Sign-in methods</dt><dd>${user.authProviders?.length ? user.authProviders.map(provider => `<span class="badge">${escapeHtml(provider)}</span>`).join(' ') : '<span class="badge">password</span>'}</dd></div>
            <div><dt>Member since</dt><dd>${new Date(user.createdAt).toLocaleString()}</dd></div>
            <div><dt>Last profile update</dt><dd>${new Date(user.updatedAt).toLocaleString()}</dd></div>
            <div><dt>Last login</dt><dd>${user.lastLoginAt ? new Date(user.lastLoginAt).toLocaleString() : 'No recorded login'}</dd></div>
          </dl>
        </article>
      </section>`;
  } catch (error) {
    const message = escapeHtml(error instanceof Error ? error.message : 'Unable to load member details.');
    document.getElementById('detail-content').innerHTML = `<div class="notice error" role="alert">${message}</div>`;
  }
}
</script>
</body>
</html>
