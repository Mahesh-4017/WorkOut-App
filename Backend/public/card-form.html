<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home card editor · Motion Library</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<script type="module">
import { initLayout } from '/js/layout.js';
import { get, post, put } from '/js/api.js';
import { toast } from '/js/toast.js';
import { videoEmbed, escapeHtml } from '/js/app.js';
import { mountImagePicker } from '/js/image-picker.js';

if (await initLayout('Home card editor')) {
  const root = document.getElementById('page-content');
  root.innerHTML = `
    <div class="detail-toolbar"><a class="text-link" href="/cards.html">← All Home cards</a></div>
    <form class="form-grid" id="form">
      <div class="panel">
        <div class="field"><label for="title">Card title</label><input id="title" name="title" required maxlength="160"></div>
        <div class="field"><label for="description">Description</label><textarea id="description" name="description"></textarea></div>
        <div class="field"><label for="videoUrl">Exercise video URL</label><input id="videoUrl" name="videoUrl" type="url" required placeholder="https://youtube.com/watch?v=..."></div>
        <div class="field"><label for="thumbnailUrl">Thumbnail image URL</label><input id="thumbnailUrl" name="thumbnailUrl" type="text" placeholder="Or select an image below"></div>
        <div class="field">
          <label for="imageFile">Upload thumbnail</label>
          <div id="drop-zone" class="image-drop-zone" tabindex="0">
            <span class="drop-icon" aria-hidden="true">↑</span>
            <strong>Drop an image here</strong>
            <span>or choose from your computer or photo library</span>
            <button type="button" class="btn secondary" id="choose-image">Choose image</button>
            <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          </div>
          <span class="field-hint">JPEG, PNG, or WebP · up to 8 MB. Images are stored in MongoDB.</span>
        </div>
        <span id="image-error" class="upload-error hidden" role="alert"></span>
        <div id="image-preview-wrap" class="image-preview-wrap hidden">
          <img id="image-preview" alt="Selected thumbnail preview">
          <button type="button" class="btn secondary" id="remove-image">Remove selected image</button>
        </div>
        <div class="field"><label for="tags">Tags</label><input id="tags" name="tags" placeholder="mobility, morning"></div>
      </div>
      <div>
        <div class="panel">
          <div class="field"><label for="category">Category</label><input id="category" name="category" value="General"></div>
          <div class="field"><label for="audience">Audience</label><select id="audience" name="audience"><option value="all">Everyone</option><option value="male">Male</option><option value="female">Female</option></select></div>
          <div class="field"><label for="status">Status</label><select id="status" name="status"><option value="draft">Draft</option><option value="published">Published</option></select></div>
          <div class="field"><label for="order">Order</label><input id="order" name="order" type="number" value="0"></div>
          <label><input name="isFeatured" type="checkbox"> Feature this card</label>
          <button class="btn" style="margin-top:20px" type="submit">Save Home card</button>
        </div>
        <div class="panel" style="margin-top:18px">
          <div class="eyebrow">Video preview</div>
          <button class="btn secondary" id="open-preview" type="button">Open video preview</button>
          <div id="video-preview" class="video-placeholder" style="margin-top:14px">Paste a video URL</div>
        </div>
      </div>
    </form>`;

  const form = document.getElementById('form');
  const cardId = new URLSearchParams(location.search).get('id');
  const imagePicker = mountImagePicker({ urlInputId: 'thumbnailUrl' });

  if (cardId) {
    try {
      const { data } = await get(`/cards/${encodeURIComponent(cardId)}`);
      for (const [key, value] of Object.entries(data)) {
        const field = form.elements[key];
        if (!field) continue;
        if (key === 'tags') field.value = value.join(', ');
        else if (key === 'isFeatured') field.checked = value;
        else field.value = value;
      }
      imagePicker.refresh();
    } catch (error) {
      toast(error instanceof Error ? error.message : 'Unable to load this card.', 'error');
    }
  }

  form.videoUrl.oninput = () => {
    const src = videoEmbed(form.videoUrl.value);
    document.getElementById('video-preview').innerHTML = src
      ? `<iframe title="Video preview" src="${escapeHtml(src)}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`
      : 'Paste a video URL';
  };
  document.getElementById('open-preview').onclick = () => {
    const src = videoEmbed(form.videoUrl.value);
    if (!src) return toast('Add a valid video URL first.', 'error');
    document.getElementById('preview-modal-content').innerHTML = `<iframe title="Video preview" src="${escapeHtml(src)}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`;
    document.getElementById('preview-modal').classList.remove('hidden');
  };
  form.onsubmit = async event => {
    event.preventDefault();
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    try {
      const thumbnailUrl = await imagePicker.getUrl();
      const data = Object.fromEntries(new FormData(form));
      data.thumbnailUrl = thumbnailUrl;
      data.tags = data.tags ? data.tags.split(',').map(value => value.trim()).filter(Boolean) : [];
      data.order = Number(data.order);
      data.isFeatured = form.elements.isFeatured.checked;
      if (cardId) await put(`/cards/${encodeURIComponent(cardId)}`, data);
      else await post('/cards', data);
      toast('Home card saved.');
      setTimeout(() => { location.href = '/cards.html'; }, 500);
    } catch (error) {
      toast(error instanceof Error ? error.message : 'Unable to save this card.', 'error');
      submitButton.disabled = false;
    }
  };
  window.addEventListener('pagehide', () => imagePicker.dispose(), { once: true });
}
</script>
</body>
</html>
