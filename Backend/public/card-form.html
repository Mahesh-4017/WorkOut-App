<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card editor · Motion Library</title><link rel="stylesheet" href="/css/styles.css"></head><body><script type="module">import {initLayout} from '/js/layout.js';import {get,post,put} from '/js/api.js';import {toast} from '/js/toast.js';import {videoEmbed} from '/js/app.js';if(await initLayout('Card editor')){const root=document.getElementById('page-content');root.innerHTML='<form class="form-grid" id="form"><div class="panel"><div class="field"><label>Title</label><input name="title" required maxlength="160"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Video URL</label><input name="videoUrl" type="url" required placeholder="https://youtube.com/watch?v=..."></div><div class="field"><label>Thumbnail URL</label><input name="thumbnailUrl" type="url"></div><div class="field"><label>Tags</label><input name="tags" placeholder="mobility, morning"></div></div><div><div class="panel"><div class="field"><label>Category</label><input name="category" value="General"></div><div class="field"><label>Audience</label><select name="audience"><option value="all">Everyone</option><option value="male">Male</option><option value="female">Female</option></select></div><div class="field"><label>Status</label><select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="field"><label>Order</label><input name="order" type="number" value="0"></div><label><input name="isFeatured" type="checkbox"> Featured on public page</label><button class="btn" style="margin-top:20px" type="submit">Save card</button></div><div class="panel" style="margin-top:18px"><div class="eyebrow">Live preview</div><button class="btn secondary" id="open-preview" type="button">Open video preview</button><div id="preview" class="video-placeholder" style="margin-top:14px">Paste a video URL</div></div></div></form>';const form=document.getElementById('form');const id=new URLSearchParams(location.search).get('id');if(id){const {data}=await get('/cards/'+id);Object.entries(data).forEach(([key,value])=>{const field=form.elements[key];if(!field)return;if(key==='tags')field.value=value.join(', ');else if(key==='isFeatured')field.checked=value;else field.value=value})}form.videoUrl.oninput=()=>{const src=videoEmbed(form.videoUrl.value);preview.innerHTML=src?`<iframe title="Video preview" src="${src}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`:'Paste a video URL'};document.getElementById('open-preview').onclick=()=>{const src=videoEmbed(form.videoUrl.value);if(!src)return toast('Add a valid video URL first','error');document.getElementById('preview-modal-content').innerHTML=`<iframe title="Video preview" src="${src}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`;document.getElementById('preview-modal').classList.remove('hidden')};form.onsubmit=async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));data.tags=data.tags?data.tags.split(',').map(v=>v.trim()).filter(Boolean):[];data.order=Number(data.order);data.isFeatured=form.isFeatured.checked;try{if(id)await put('/cards/'+id,data);else await post('/cards',data);toast('Card saved');setTimeout(()=>location.href='/cards.html',500)}catch(err){toast(err.message,'error')}};}</script></body></html>
