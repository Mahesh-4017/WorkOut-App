<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · Motion Library</title><link rel="stylesheet" href="/css/styles.css"></head><body class="auth-page"><main class="auth-box"><div class="eyebrow">Private studio</div><h1>Welcome back.</h1><p class="eyebrow">Sign in to manage your video library.</p><form id="login-form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Enter dashboard</button><p id="error" class="eyebrow"></p></form></main><script type="module">import {post} from '/js/api.js';const form=document.getElementById('login-form');const error=document.getElementById('error');form.onsubmit=async(e)=>{e.preventDefault();error.textContent='Signing in...';try{await post('/auth/login',{email:email.value,password:password.value});location.href='/dashboard.html'}catch(err){error.textContent=err.message}};</script></body></html>
